    <!-- Audio Player Logic & Realtime Visualizer -->
    <script>
        const audio = new Audio();
        let audioCtx, analyser, source, canvas, canvasCtx;
        let isPlaying = false;

        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const songTitle = document.getElementById('song-title');
        const statusText = document.getElementById('status-text');
        const timeDisplay = document.getElementById('time-display');
        const playBtn = document.getElementById('play-btn');

        function initVisualizer() {
            if (audioCtx) return;
            canvas = document.getElementById('visualizer');
            canvasCtx = canvas.getContext('2d');
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;

            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            renderFrame();
        }

        function renderFrame() {
            requestAnimationFrame(renderFrame);
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * canvas.height;
                
                canvasCtx.fillStyle = `rgba(245, 158, 11, ${dataArray[i] / 255 + 0.2})`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                x += barWidth + 3;
            }
        }

        function playPreset(url, title) {
            initVisualizer();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            audio.src = url;
            songTitle.innerText = title;
            audio.play();
            setPlayingState(true);
        }

        function loadCustomAudio(e) {
            const file = e.target.files[0];
            if (file) {
                initVisualizer();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                audio.src = URL.createObjectURL(file);
                songTitle.innerText = file.name;
                audio.play();
                setPlayingState(true);
            }
        }

        function togglePlay() {
            if (!audio.src) return;
            initVisualizer();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audio.pause();
                setPlayingState(false);
            } else {
                audio.play();
                setPlayingState(true);
            }
        }

        function stopAudio() {
            audio.pause();
            audio.currentTime = 0;
            setPlayingState(false);
            statusText.innerText = "روک دیا گیا";
        }

        function setPlayingState(playing) {
            isPlaying = playing;
            if (playing) {
                reel1.classList.add('spinning');
                reel2.classList.add('spinning');
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                statusText.innerHTML = '<i class="fa-solid fa-volume-high text-amber-400"></i> پلے ہو رہا ہے';
            } else {
                reel1.classList.remove('spinning');
                reel2.classList.remove('spinning');
                playBtn.innerHTML = '<i class="fa-solid fa-play ml-1"></i>';
                statusText.innerHTML = '<i class="fa-solid fa-circle-pause text-gray-400"></i> پاؤزڈ';
            }
        }

        // Time Counter Update
        audio.ontimeupdate = () => {
            const mins = Math.floor(audio.currentTime / 60);
            const secs = Math.floor(audio.currentTime % 60);
            timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        audio.onended = () => setPlayingState(false);
    </script>

    <!-- Audio Synth & Spectrum Script -->
    <script>
        let audioCtx, osc, gainNode, isPlaying = false;
        let audioElement = new Audio();
        let audioSource, analyser, canvas, canvasCtx;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                canvas = document.getElementById('visualizer');
                canvasCtx = canvas.getContext('2d');
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                
                audioSource = audioCtx.createMediaElementSource(audioElement);
                audioSource.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                drawVisualizer();
            }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) return;

            let bufferLength = analyser.frequencyBinCount;
            let dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            let barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 2;
                canvasCtx.fillStyle = `rgb(${barHeight + 100}, 180, 20)`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }
        }

        function playPresetSong(num) {
            initAudioContext();
            const titles = ["پاکستانی کلاسک سنویو 1", "شاہراہِ نوسٹالجیا بیٹس"];
            document.getElementById('track-title').innerText = titles[num-1] || "ٹریک پلے ہو رہا ہے";
            
            // Generate synthetic retro beat using Web Audio API synth if no audio file
            playSynthBeat();
            startReels();
        }

        function playSynthBeat() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('track-status').innerText = "پلے ہو رہا ہے (Synth Mode)";
            isPlaying = true;
            document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
            startReels();
        }

        function loadCustomAudio(e) {
            initAudioContext();
            const file = e.target.files[0];
            if (file) {
                audioElement.src = URL.createObjectURL(file);
                document.getElementById('track-title').innerText = file.name;
                audioElement.play();
                isPlaying = true;
                document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
                document.getElementById('track-status').innerText = "کسٹم MP3 پلے ہو رہا ہے";
                startReels();
            }
        }

        function togglePlay() {
            initAudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (isPlaying) {
                audioElement.pause();
                stopReels();
                isPlaying = false;
                document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-play"></i>';
                document.getElementById('track-status').innerText = "پاؤزڈ";
            } else {
                audioElement.play().catch(() => playSynthBeat());
                startReels();
                isPlaying = true;
                document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
            }
        }

        function stopAudio() {
            audioElement.pause();
            audioElement.currentTime = 0;
            stopReels();
            isPlaying = false;
            document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-play"></i>';
            document.getElementById('track-status').innerText = "روک دیا گیا";
        }

        function changeSpeed(val) {
            audioElement.playbackRate = val;
            document.getElementById('speed-val').innerText = val + 'x';
        }

        function startReels() {
            document.getElementById('reel1').classList.add('spinning');
            document.getElementById('reel2').classList.add('spinning');
        }

        function stopReels() {
            document.getElementById('reel1').classList.remove('spinning');
            document.getElementById('reel2').classList.remove('spinning');
        }
    </script>

    <!-- Logic -->
    <script>
        const player = document.getElementById('main-player');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const titleDisplay = document.getElementById('current-title');
        const statusDisplay = document.getElementById('player-status');

        function playTrack(url, title) {
            player.src = url;
            titleDisplay.innerText = title;
            statusDisplay.innerText = "پلے ہو رہا ہے...";
            player.play().catch(e => {
                alert("آڈیو لوڈ ہونے میں مسئلہ ہے، برائے مہربانی دوبارہ پلے پر کلک کریں۔");
            });
            startSpin();
        }

        function startSpin() {
            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            statusDisplay.innerText = "پلے ہو رہا ہے";
        }

        function stopSpin() {
            reel1.classList.remove('spinning');
            reel2.classList.remove('spinning');
            statusDisplay.innerText = "روکا گیا ہے";
        }

        player.onplay = startSpin;
        player.onpause = stopSpin;
        player.onended = stopSpin;
    </script>
