<!DOCTYPE html>
<html lang="ur" dir="rtl" class="h-full">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#09090b"
  >

  <meta
    name="description"
    content="کوئٹہ رنگین ہوٹل — 90s پاکستانی کلاسک، صوفی، سندھی اور اداس گانے"
  >

  <title>
    کوئٹہ رنگین ہوٹل ☕ — 90s پاکستانی کلاسک ریڈیو
  </title>


  <!-- =====================================================
       TAILWIND
  ====================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- =====================================================
       GOOGLE FONTS
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       TAILWIND CONFIG
  ====================================================== -->

  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {

            nastaliq: [
              '"Noto Nastaliq Urdu"',
              'serif'
            ],

            gulzar: [
              'Gulzar',
              'serif'
            ],

            sans: [
              'Outfit',
              'sans-serif'
            ]

          }

        }

      }

    };

  </script>


  <!-- =====================================================
       CUSTOM CSS
  ====================================================== -->

  <style>


    /* =====================================================
       GLOBAL
    ====================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      min-height: 100%;

      background: #09090b;

    }


    body {

      -webkit-tap-highlight-color:
        transparent;

      overscroll-behavior:
        none;

    }


    /* =====================================================
       BACKGROUND
    ====================================================== */

    .hero-bg-container {

      background-image:

        linear-gradient(
          to bottom,
          rgba(15, 23, 42, 0.40),
          rgba(15, 23, 42, 0.78)
        ),

        url("hero-mob.png");

      background-size:
        cover;

      background-position:
        center center;

      background-repeat:
        no-repeat;

      background-attachment:
        scroll;

    }


    @media (min-width: 640px) {

      .hero-bg-container {

        background-image:

          linear-gradient(
            to bottom,
            rgba(15, 23, 42, 0.40),
            rgba(15, 23, 42, 0.78)
          ),

          url("hero-bg.png");

        background-position:
          center bottom;

        background-attachment:
          fixed;

      }

    }


    /* =====================================================
       VINYL
    ====================================================== */

    @keyframes spin {

      from {

        transform:
          rotate(0deg);

      }

      to {

        transform:
          rotate(360deg);

      }

    }


    .vinyl-spin {

      animation:
        spin 10s linear infinite;

      animation-play-state:
        running;

    }


    .vinyl-paused {

      animation-play-state:
        paused;

    }


    /* =====================================================
       GOLD TEXT
    ====================================================== */

    .heading-gold {

      color:
        #FFC72C;

      text-shadow:

        0 2px 4px
        rgba(0, 0, 0, 0.95),

        0 0 12px
        rgba(255, 199, 44, 0.40),

        0 0 25px
        rgba(0, 0, 0, 0.80);

    }


    .subheading-gold {

      color:
        #FFE58F;

      text-shadow:

        0 2px 4px
        rgba(0, 0, 0, 0.90),

        0 0 8px
        rgba(255, 229, 143, 0.30);

    }


    /* =====================================================
       SEEK BAR
    ====================================================== */

    .pan-seekbar-fill {

      background:
        #ffffff;

      border-radius:
        999px;

      transition:
        width 150ms linear;

    }


    #seek-container {

      touch-action:
        none;

    }


    /* =====================================================
       TOAST
    ====================================================== */

    @keyframes slideUpFade {

      0% {

        opacity: 0;

        transform:
          translate(-50%, 20px)
          scale(0.95);

      }

      100% {

        opacity: 1;

        transform:
          translate(-50%, 0)
          scale(1);

      }

    }


    .toast-animate {

      animation:
        slideUpFade
        0.3s
        cubic-bezier(
          0.16,
          1,
          0.3,
          1
        )
        forwards;

    }


    /* =====================================================
       SELECT
    ====================================================== */

    #playlist-select {

      appearance:
        none;

      -webkit-appearance:
        none;

      background-color:
        rgba(0, 0, 0, 0.65);

    }


    #playlist-select option {

      background:
        #18120e;

      color:
        #ffe58f;

    }


    /* =====================================================
       PLAYER IFRAME
       
       IMPORTANT:
       Keep YouTube player in DOM.
       It is visually hidden but remains available
       to YouTube API.
    ====================================================== */

    #youtube-player-container {

      position:
        fixed;

      width:
        1px;

      height:
        1px;

      left:
        -9999px;

      top:
        -9999px;

      overflow:
        hidden;

      opacity:
        0;

      pointer-events:
        none;

    }


    #yt-audio-player {

      width:
        1px;

      height:
        1px;

      border:
        0;

    }


    /* =====================================================
       MOBILE HEIGHT
    ====================================================== */

    @media (max-height: 700px) {

      .main-player-area {

        transform:
          scale(0.92);

        transform-origin:
          center center;

      }

    }


    /* =====================================================
       SCROLLBAR
    ====================================================== */

    ::-webkit-scrollbar {

      width:
        5px;

    }


    ::-webkit-scrollbar-track {

      background:
        rgba(0, 0, 0, 0.20);

    }


    ::-webkit-scrollbar-thumb {

      background:
        rgba(255, 199, 44, 0.35);

      border-radius:
        999px;

    }


  </style>

</head>


<body
  class="
    bg-zinc-950
    text-white
    min-h-screen
    font-sans
    hero-bg-container
    flex
    flex-col
    justify-between
    selection:bg-amber-400
    selection:text-black
    relative
    overflow-x-hidden
  "
>


  <!-- =====================================================
       HIDDEN YOUTUBE PLAYER
  ====================================================== -->

  <div id="youtube-player-container">

    <div id="yt-audio-player"></div>

  </div>


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header
    class="
      w-full
      px-3.5
      sm:px-8
      py-3
      flex
      justify-between
      items-center
      z-50
      select-none
    "
  >


    <!-- PAKISTAN TIME -->

    <div
      class="
        bg-black/70
        backdrop-blur-md
        border
        border-white/15
        px-3
        py-1.5
        rounded-full
        flex
        items-center
        gap-2
        shadow-xl
      "
    >

      <span
        class="
          text-[11px]
          font-nastaliq
          text-amber-200
        "
      >
        پاکستان
      </span>

      <span
        id="clock"
        class="
          text-xs
          font-mono
          font-bold
          text-amber-300
          dir-ltr
        "
      >
        --:--:-- --
      </span>

    </div>


    <!-- LIVE VISITORS -->

    <div
      class="
        bg-black/70
        backdrop-blur-md
        border
        border-white/15
        px-3
        py-1.5
        rounded-full
        flex
        items-center
        gap-2
        shadow-xl
      "
    >

      <span
        class="
          relative
          flex
          h-2
          w-2
        "
      >

        <span
          class="
            animate-ping
            absolute
            inline-flex
            h-full
            w-full
            rounded-full
            bg-emerald-400
            opacity-75
          "
        ></span>

        <span
          class="
            relative
            inline-flex
            rounded-full
            h-2
            w-2
            bg-emerald-500
          "
        ></span>

      </span>


      <span
        id="live-count"
        class="
          text-xs
          font-bold
          font-mono
          text-emerald-300
        "
      >
        1
      </span>


      <span
        class="
          text-[10px]
          font-nastaliq
          text-white/80
        "
      >
        ڈھابے پر موجود ہیں
      </span>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main
    class="
      main-player-area
      w-full
      max-w-sm
      sm:max-w-md
      mx-auto
      px-4
      py-2
      flex
      flex-col
      items-center
      gap-3.5
      sm:gap-5
      z-10
      my-auto
    "
  >


    <!-- ===================================================
         TITLE
    ==================================================== -->

    <div
      class="
        text-center
        space-y-0.5
        select-none
      "
    >

      <h1
        class="
          text-4xl
          sm:text-5xl
          font-bold
          font-gulzar
          heading-gold
          tracking-wide
          leading-tight
        "
      >
        کوئٹہ رنگین ہوٹل
      </h1>


      <p
        class="
          font-nastaliq
          text-xs
          sm:text-sm
          subheading-gold
          font-medium
        "
      >
        دیکھ مگر پیار سے
      </p>

    </div>


    <!-- ===================================================
         DIALOGUE
    ==================================================== -->

    <button
      id="dialogue-btn"
      type="button"
      class="
        bg-[#0b1d14]/95
        border
        border-emerald-500/60
        hover:border-emerald-400
        active:scale-[0.98]
        px-4
        py-2
        rounded-full
        backdrop-blur-xl
        text-center
        transition
        cursor-pointer
        shadow-2xl
        group
        flex
        items-center
        gap-2
        max-w-[92vw]
      "
    >

      <span
        id="dialogue-text"
        class="
          font-nastaliq
          text-emerald-100
          text-xs
          sm:text-sm
          group-hover:text-white
          transition
          truncate
          drop-shadow-md
        "
      >
        "استاد! ایک کڑک چائے اور پراٹھا لگانا!"
      </span>


      <span
        class="
          text-emerald-300
          text-xs
          shrink-0
        "
      >
        💬
      </span>

    </button>


    <!-- ===================================================
         PLAYER CARD
    ==================================================== -->

    <section
      class="
        w-full
        bg-[#1c120c]/90
        backdrop-blur-xl
        border
        border-amber-900/40
        rounded-[24px]
        p-3.5
        sm:p-4
        shadow-2xl
        relative
        overflow-hidden
      "
      aria-label="Music Player"
    >


      <!-- =================================================
           TRACK ROW
      ================================================== -->

      <div
        class="
          flex
          items-center
          justify-between
          gap-3
        "
      >


        <!-- ===============================================
             VINYL ART
        ================================================ -->

        <div
          class="
            relative
            w-16
            h-16
            rounded-full
            overflow-hidden
            shrink-0
            shadow-lg
            border
            border-white/10
            bg-zinc-900
          "
        >

          <img
            id="track-art"
            src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=300&auto=format&fit=crop"
            class="
              w-full
              h-full
              object-cover
              vinyl-spin
              vinyl-paused
            "
            alt="Album Disc"
            loading="eager"
          >


          <div
            class="
              absolute
              inset-0
              m-auto
              w-3.5
              h-3.5
              bg-zinc-950
              border
              border-white/20
              rounded-full
            "
          ></div>

        </div>


        <!-- ===============================================
             SONG INFORMATION
        ================================================ -->

        <div
          class="
            flex-1
            min-w-0
            text-right
            space-y-1
          "
          dir="rtl"
        >

          <h2
            id="track-title"
            class="
              font-sans
              font-bold
              text-sm
              text-white
              truncate
              leading-snug
            "
          >
            کوئٹہ رنگین ہوٹل ریڈیو
          </h2>


          <p
            id="track-artist"
            class="
              font-sans
              text-[11px]
              text-white/60
              truncate
              dir-ltr
              text-right
            "
          >
            Pakistani Classic Radio
          </p>


          <!-- =============================================
               SEEK BAR
          ============================================== -->

          <div
            class="pt-1 space-y-1"
            dir="ltr"
          >

            <div
              id="seek-container"
              class="
                w-full
                bg-white/20
                hover:bg-white/30
                rounded-full
                h-[5px]
                relative
                cursor-pointer
                flex
                items-center
                overflow-hidden
              "
              role="slider"
              aria-label="Song progress"
            >

              <div
                id="progress-bar"
                class="
                  pan-seekbar-fill
                  h-full
                  w-0
                "
              ></div>

            </div>


            <div
              class="
                flex
                justify-between
                text-[10px]
                font-mono
                text-white/50
                dir-ltr
              "
            >

              <span id="time-curr">
                0:00
              </span>

              <span>
                /
              </span>

              <span id="time-dur">
                0:00
              </span>

            </div>

          </div>

        </div>


        <!-- ===============================================
             CONTROLS
        ================================================ -->

        <div
          class="
            flex
            items-center
            gap-1.5
            dir-ltr
            shrink-0
            pl-1
          "
        >

          <!-- PREVIOUS -->

          <button
            id="prev-btn"
            type="button"
            aria-label="Previous song"
            class="
              text-white/70
              hover:text-white
              active:scale-90
              transition
              text-xs
              p-1.5
            "
          >
            ⏮
          </button>


          <!-- PLAY -->

          <button
            id="play-btn"
            type="button"
            aria-label="Play or pause"
            class="
              w-11
              h-11
              rounded-full
              bg-white
              text-zinc-950
              font-black
              shadow-xl
              hover:scale-105
              active:scale-95
              transition
              flex
              items-center
              justify-center
              text-sm
              pl-0.5
            "
          >
            ▶
          </button>


          <!-- NEXT -->

          <button
            id="next-btn"
            type="button"
            aria-label="Next song"
            class="
              text-white/70
              hover:text-white
              active:scale-90
              transition
              text-xs
              p-1.5
            "
          >
            ⏭
          </button>

        </div>

      </div>


      <!-- =================================================
           PLAYLIST DROPDOWN
      ================================================== -->

      <div
        class="
          mt-3
          pt-2.5
          border-t
          border-amber-900/30
        "
        dir="rtl"
      >

        <div class="relative">

          <select
            id="playlist-select"
            aria-label="Playlist"
            class="
              w-full
              bg-black/60
              border
              border-white/10
              rounded-xl
              px-3
              py-2
              pr-3
              text-xs
              text-amber-200
              focus:outline-none
              focus:border-amber-500
              cursor-pointer
              transition
            "
          >

            <option value="">
              Loading playlist...
            </option>

          </select>

        </div>

      </div>

    </section>


    <!-- ===================================================
         ACTION BUTTONS
    ==================================================== -->

    <div
      class="
        w-full
        flex
        flex-row
        items-center
        gap-2.5
      "
    >


      <!-- ===============================================
           CHAI
      ================================================ -->

      <button
        id="chai-btn"
        type="button"
        class="
          flex-1
          bg-[#1a382b]/90
          hover:bg-[#204535]
          border
          border-emerald-700/40
          py-2.5
          px-3.5
          rounded-full
          flex
          items-center
          justify-between
          active:scale-95
          transition
          shadow-lg
          backdrop-blur-md
        "
      >

        <div
          class="
            flex
            items-center
            gap-2
          "
          dir="rtl"
        >

          <span class="text-sm">
            ☕
          </span>

          <span
            class="
              font-gulzar
              text-xs
              sm:text-sm
              text-emerald-100
            "
          >
            ایک کڑک چائے لگاؤ
          </span>

        </div>


        <span
          id="chai-count"
          class="
            bg-[#eab308]
            text-zinc-950
            font-bold
            font-mono
            text-xs
            w-6
            h-6
            round
