<!DOCTYPE html>
<html lang="ur" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>کوئٹہ رنگین ہوٹل ☕ — 90s پاکستانی کلاسک ریڈیو</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            nastaliq: ['"Noto Nastaliq Urdu"', 'serif'],
            gulzar: ['Gulzar', 'serif'],
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* 📱 MOBILE BACKGROUND */
    .hero-bg-container {
      background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.7)), url('hero-mob.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    /* 💻 DESKTOP BACKGROUND */
    @media (min-width: 640px) {
      .hero-bg-container {
        background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.7)), url('hero-bg.png');
        background-position: center bottom;
        background-attachment: fixed;
      }
    }

    /* Spinning Vinyl Disc */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-spin {
      animation: spin 10s linear infinite;
    }
    .vinyl-paused {
      animation-play-state: paused;
    }

    /* High-Contrast Golden Urdu Titles */
    .heading-gold {
      color: #FFC72C;
      text-shadow: 
        0 2px 4px rgba(0, 0, 0, 0.9),
        0 0 12px rgba(255, 199, 44, 0.4),
        0 0 25px rgba(0, 0, 0, 0.8);
    }

    .subheading-gold {
      color: #FFE58F;
      text-shadow: 
        0 2px 4px rgba(0, 0, 0, 0.9),
        0 0 8px rgba(255, 229, 143, 0.3);
    }

    /* Pan Wala Seekbar Fill */
    .pan-seekbar-fill {
      background: #FFF;
      border-radius: 99px;
      transition: width 150ms linear;
    }

    /* Toast Animation */
    @keyframes slideUpFade {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    .toast-animate {
      animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="bg-zinc-950 text-white min-h-screen font-sans hero-bg-container flex flex-col justify-between selection:bg-amber-400 selection:text-black relative overflow-x-hidden">

  <!-- TOP BAR -->
  <header class="w-full px-3.5 sm:px-8 py-3 flex justify-between items-center z-50 select-none">
    
    <!-- Time Pill -->
    <div class="bg-black/70 backdrop-blur-md border border-white/15 px-3 py-1.5 rounded-full flex items-center gap-2 shadow-xl">
      <span class="text-[11px] font-nastaliq text-amber-200">پاکستان</span>
      <span class="text-xs font-mono font-bold text-amber-300 dir-ltr" id="clock">--:--:-- --</span>
    </div>

    <!-- Live Visitors Pill -->
    <div class="bg-black/70 backdrop-blur-md border border-white/15 px-3 py-1.5 rounded-full flex items-center gap-2 shadow-xl">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="text-xs font-bold font-mono text-emerald-300" id="live-count">1</span>
      <span class="text-[10px] font-nastaliq text-white/80">ڈھابے پر موجود ہیں</span>
    </div>

  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="w-full max-w-sm sm:max-w-md mx-auto px-4 py-2 flex flex-col items-center gap-3.5 sm:gap-5 z-10 my-auto">

    <!-- HEADINGS -->
    <div class="text-center space-y-0.5 select-none">
      <h1 class="text-4xl sm:text-5xl font-bold font-gulzar heading-gold tracking-wide leading-tight">
        کوئٹہ رنگین ہوٹل
      </h1>
      <p class="font-nastaliq text-xs sm:text-sm subheading-gold font-medium">
        دیکھ مگر پیار سے
      </p>
    </div>

    <!-- DIALOGUE BANNER -->
    <div id="dialogue-btn" class="bg-[#0b1d14]/95 border border-emerald-500/60 hover:border-emerald-400 px-4 py-2 rounded-full backdrop-blur-xl text-center transition cursor-pointer shadow-2xl group flex items-center gap-2 max-w-[92vw]">
      <span id="dialogue-text" class="font-nastaliq text-emerald-100 text-xs sm:text-sm group-hover:text-white transition truncate drop-shadow-md">
        "استاد! ایک کڑک چائے اور پراٹھا لگانا!"
      </span>
      <span class="text-emerald-300 text-xs shrink-0">💬</span>
    </div>

    <!-- EXACT PAN WALA PLAYER CARD DESIGN -->
    <div class="w-full bg-[#1c120c]/90 backdrop-blur-xl border border-amber-900/40 rounded-[24px] p-3.5 sm:p-4 shadow-2xl relative overflow-hidden">
      
      <div class="flex items-center justify-between gap-3">
        
        <!-- Vinyl Artwork -->
        <div class="relative w-16 h-16 rounded-full overflow-hidden shrink-0 shadow-lg border border-white/10">
          <img id="track-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover vinyl-spin vinyl-paused" alt="Album Disc" />
          <div class="absolute inset-0 m-auto w-3.5 h-3.5 bg-zinc-950 border border-white/20 rounded-full"></div>
        </div>

        <!-- Song Metadata & Progress Bar -->
        <div class="flex-1 min-w-0 text-right space-y-1" dir="rtl">
          <h2 id="track-title" class="font-sans font-bold text-sm text-white truncate leading-snug">
            Kari Aa Qabo Kaye
          </h2>
          <p id="track-artist" class="font-sans text-[11px] text-white/60 truncate dir-ltr text-right">
            Jalal Chandio
          </p>

          <!-- Progress Bar & Duration -->
          <div class="pt-1 space-y-1" dir="ltr">
            <div id="seek-container" class="w-full bg-white/20 hover:bg-white/30 rounded-full h-[4px] relative cursor-pointer flex items-center overflow-hidden">
              <div id="progress-bar" class="pan-seekbar-fill h-full w-0"></div>
            </div>
            
            <div class="flex justify-between text-[10px] font-mono text-white/50 dir-ltr">
              <span id="time-curr">0:00</span>
              <span>/</span>
              <span id="time-dur">0:00</span>
            </div>
          </div>
        </div>

        <!-- Player Controls -->
        <div class="flex items-center gap-1.5 dir-ltr shrink-0 pl-1">
          <button id="prev-btn" class="text-white/70 hover:text-white active:scale-90 transition text-xs p-1">
            ⏮
          </button>

          <!-- Play/Pause Button -->
          <button id="play-btn" class="w-11 h-11 rounded-full bg-white text-zinc-950 font-black shadow-xl hover:scale-105 active:scale-95 transition flex items-center justify-center text-sm pl-0.5">
            ▶
          </button>

          <button id="next-btn" class="text-white/70 hover:text-white active:scale-90 transition text-xs p-1">
            ⏭
          </button>
        </div>

      </div>

      <!-- PLAYLIST SELECTOR DROPDOWN -->
      <div class="mt-3 pt-2.5 border-t border-amber-900/30" dir="rtl">
        <select id="playlist-select" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-amber-200 focus:outline-none focus:border-amber-500 cursor-pointer">
          <!-- Populated dynamically from JS -->
        </select>
      </div>

    </div>

    <!-- ACTION BUTTONS -->
    <div class="w-full flex flex-row items-center gap-2.5">
      <!-- Dark Green Pill Button with Yellow Badge -->
      <button id="chai-btn" class="flex-1 bg-[#1a382b]/90 hover:bg-[#204535] border border-emerald-700/40 py-2.5 px-3.5 rounded-full flex items-center justify-between active:scale-95 transition shadow-lg backdrop-blur-md">
        <div class="flex items-center gap-2" dir="rtl">
          <span class="text-sm">☕</span>
          <span class="font-gulzar text-xs sm:text-sm text-emerald-100">ایک کڑک چائے لگاؤ</span>
        </div>
        <span id="chai-count" class="bg-[#eab308] text-zinc-950 font-bold font-mono text-xs w-6 h-6 rounded-full flex items-center justify-center shadow-md">0</span>
      </button>

      <!-- Share Button -->
      <button id="share-btn" class="bg-[#1c120c]/80 hover:bg-[#281b12] border border-amber-900/40 px-4 py-2.5 rounded-full flex items-center justify-center text-xs font-sans font-medium text-white/90 active:scale-95 transition backdrop-blur-md gap-1.5">
        <svg viewBox="0 0 24 24" fill="none" class="w-3.5 h-3.5 text-white/80" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span>Share</span>
      </button>
    </div>

  </main>

  <!-- POPUP TOAST -->
  <div id="toast-popup" class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-[#0b1d14]/95 border border-emerald-500 text-emerald-100 font-nastaliq text-xs px-4 py-2 rounded-full shadow-2xl backdrop-blur-md hidden z-50 transition-all pointer-events-none text-center whitespace-nowrap max-w-[90vw] truncate">
    <span id="toast-text">استاد! ایک کڑک چائے اور پراٹھا لگانا!</span>
  </div>

  <!-- HIDDEN IFRAME FOR YOUTUBE PLAYLIST ENGINE -->
  <div class="hidden-player-container" style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none;">
    <iframe 
      id="yt-audio-player" 
      src="https://www.youtube.com/embed?listType=playlist&list=PLA_92R_tFNKiE08FuLrw687C4HQx38UFI&enablejsapi=1&autoplay=0&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&rel=0&playsinline=1" 
      allow="autoplay" 
      frameborder="0">
    </iframe>
  </div>

  <!-- FOOTER -->
  <footer class="w-full text-center py-2 bg-black/60 backdrop-blur-md text-[10px] font-nastaliq text-white/50 border-t border-white/5 z-10">
    دیکھ مگر پیار سے — <strong>کوئٹہ رنگین ہوٹل ریڈیو</strong> ❤️
  </footer>

  <script src="app.js"></script>
</body>
</html>
