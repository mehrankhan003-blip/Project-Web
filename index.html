<html lang="ur" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Deluxe — سائبر ڈیلکس ۲۰۸۸</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Urdu Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Nastaliq Urdu', serif;
            background: #030308;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .font-gulzar {
            font-family: 'Gulzar', serif;
        }
        /* CRT Scanline Overlay */
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        /* Glass Cyber Deck */
        .cyber-deck {
            background: rgba(10, 12, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 0 40px rgba(234, 179, 8, 0.15), inset 0 0 20px rgba(239, 68, 68, 0.1);
        }
        /* Reel Animation */
        .spinning {
            animation: spin 2.5s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(-360deg); }
        }
        .neon-text-gold {
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.8), 0 0 20px rgba(234, 179, 8, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-amber-500 selection:text-black">

    <!-- CRT Scanlines Effect -->
    <div class="fixed inset-0 crt-overlay z-50"></div>

    <!-- Header -->
    <header class="py-6 border-b border-yellow-500/20 bg-black/60 backdrop-blur-md relative z-10 text-center">
        <h1 class="text-4xl md:text-6xl font-bold font-gulzar text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-200 to-red-500 neon-text-gold">
            سائبر ڈیلکس — soundscape
        </h1>
        <p class="text-xs text-yellow-500/70 mt-1 tracking-widest">مستقبل کا ریٹرو آڈیو تجربہ</p>
    </header>

    <!-- Main Deck Grid -->
    <main class="container mx-auto px-4 py-8 max-w-5xl relative z-10">
        
        <div class="cyber-deck rounded-3xl p-6 md:p-10 relative overflow-hidden">
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                
                <!-- Cassette & Realtime Spectrum Canvas (7 cols) -->
                <div class="lg:col-span-7 flex flex-col gap-6">
                    
                    <!-- Cassette Housing -->
                    <div class="bg-black/90 p-6 rounded-2xl border-2 border-yellow-500/40 relative shadow-2xl">
                        
                        <!-- Top LCD Screen -->
                        <div class="flex justify-between items-center bg-gray-950 p-3 rounded-xl border border-yellow-500/20 mb-4 font-mono text-xs">
                            <span id="track-status" class="text-yellow-400 flex items-center gap-2">
                                <span class="w-2 h-2 bg-yellow-400 rounded-full animate-ping"></span> ریڈی
                            </span>
                            <span id="track-time" class="text-gray-400">00:00</span>
                        </div>

                        <!-- Reels Assembly -->
                        <div class="flex justify-around items-center bg-gradient-to-r from-gray-950 via-slate-900 to-gray-950 p-6 rounded-xl border border-gray-800 my-2">
                            <div id="reel1" class="w-24 h-24 rounded-full border-8 border-dashed border-yellow-500 bg-black flex items-center justify-center shadow-xl transition-all">
                                <div class="w-10 h-10 bg-yellow-500/20 rounded-full border-2 border-yellow-400"></div>
                            </div>
                            
                            <div class="flex flex-col items-center gap-1">
                                <span class="text-[10px] text-red-500 font-bold uppercase tracking-widest">دیکھ مگر پیار سے</span>
                                <div class="h-2 w-20 bg-gradient-to-r from-red-600 via-yellow-500 to-green-600 rounded-full"></div>
                            </div>

                            <div id="reel2" class="w-24 h-24 rounded-full border-8 border-dashed border-yellow-500 bg-black flex items-center justify-center shadow-xl transition-all">
                                <div class="w-10 h-10 bg-yellow-500/20 rounded-full border-2 border-yellow-400"></div>
                            </div>
                        </div>

                        <!-- Track Name Display -->
                        <h3 id="track-title" class="text-xl font-bold text-yellow-300 text-center mt-4 truncate">
                            کلاسک سنپٹ 01
                        </h3>
                    </div>

                    <!-- Audio Spectrum Visualizer Canvas -->
                    <div class="bg-black/80 p-3 rounded-2xl border border-gray-800">
                        <canvas id="visualizer" class="w-full h-24 rounded-lg"></canvas>
                    </div>

                </div>

                <!-- Controls & Playlist (5 cols) -->
                <div class="lg:col-span-5 flex flex-col justify-between h-full gap-6">
                    
                    <!-- Playlist -->
                    <div class="bg-black/40 p-4 rounded-2xl border border-gray-800">
                        <h4 class="text-sm font-bold text-yellow-400 mb-3 border-b border-gray-800 pb-2 flex justify-between items-center">
                            <span><i class="fa-solid fa-compact-disc text-red-500 ml-1"></i> پلے لسٹ</span>
                            <span class="text-[10px] text-gray-500">3 ٹریکس</span>
                        </h4>

                        <div class="space-y-2">
                            <button onclick="playPresetSong(1)" class="w-full text-right bg-gray-900/80 hover:bg-yellow-500 hover:text-black p-3 rounded-xl text-sm font-bold transition flex items-center justify-between border border-gray-800 group">
                                <span>1. پاکستانی کلاسک سنویو 1</span>
                                <i class="fa-solid fa-play text-yellow-400 group-hover:text-black"></i>
                            </button>

                            <button onclick="playPresetSong(2)" class="w-full text-right bg-gray-900/80 hover:bg-yellow-500 hover:text-black p-3 rounded-xl text-sm font-bold transition flex items-center justify-between border border-gray-800 group">
                                <span>2. شاہراہِ نوسٹالجیا بیٹس</span>
                                <i class="fa-solid fa-play text-yellow-400 group-hover:text-black"></i>
                            </button>

                            <!-- Custom File Upload Option -->
                            <label class="w-full text-right bg-red-950/40 hover:bg-red-600 hover:text-white p-3 rounded-xl text-sm font-bold transition flex items-center justify-between border border-red-800/50 cursor-pointer">
                                <span><i class="fa-solid fa-upload ml-1"></i> اپنا MP3 گانا لوڈ کریں</span>
                                <input type="file" id="audio-file" accept="audio/*" class="hidden" onchange="loadCustomAudio(event)">
                            </label>
                        </div>
                    </div>

                    <!-- Physical Master Controls -->
                    <div class="bg-gray-950 p-5 rounded-2xl border border-yellow-500/30 flex flex-col gap-4">
                        <div class="flex justify-around items-center">
                            <button onclick="togglePlay()" id="play-btn" class="w-14 h-14 bg-yellow-500 text-black rounded-full flex items-center justify-center text-xl font-bold hover:scale-105 transition shadow-lg shadow-yellow-500/20">
                                <i class="fa-solid fa-play"></i>
                            </button>
                            <button onclick="stopAudio()" class="w-12 h-12 bg-red-600 text-white rounded-full flex items-center justify-center text-lg font-bold hover:scale-105 transition">
                                <i class="fa-solid fa-stop"></i>
                            </button>
                        </div>

                        <!-- Speed/Pitch Control Slider -->
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between text-[11px] text-gray-400">
                                <span>اسپیڈ / پچ</span>
                                <span id="speed-val">1.0x</span>
                            </div>
                            <input type="range" id="speed-slider" min="0.5" max="1.5" step="0.1" value="1.0" oninput="changeSpeed(this.value)" class="w-full accent-yellow-400">
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-gray-600 border-t border-gray-900 relative z-10">
        <p>© 2026 Cyber Deluxe Audio Engine — Built for Vercel</p>
    </footer>

    <!-- Audio Synth & Spectrum Script -->
    <script>
        let audioCtx, osc, gainNode, isPlaying = false;
        let audioElement = new Audio();
        let audioSource, analyser, canvas, canvasCtx;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                canvas = document.getElementById('visualizer');
                canvasCtx = canvas.getContext('2d');
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                
                audioSource = audioCtx.createMediaElementSource(audioElement);
                audioSource.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                drawVisualizer();
            }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) return;

            let bufferLength = analyser.frequencyBinCount;
            let dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            let barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 2;
                canvasCtx.fillStyle = `rgb(${barHeight + 100}, 180, 20)`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }
        }

        function playPresetSong(num) {
            initAudioContext();
            const titles = ["پاکستانی کلاسک سنویو 1", "شاہراہِ نوسٹالجیا بیٹس"];
            document.getElementById('track-title').innerText = titles[num-1] || "ٹریک پلے ہو رہا ہے";
            
            // Generate synthetic retro beat using Web Audio API synth if no audio file
            playSynthBeat();
            startReels();
        }

        function playSynthBeat() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('track-status').innerText = "پلے ہو رہا ہے (Synth Mode)";
            isPlaying = true;
            document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
            startReels();
        }

        function loadCustomAudio(e) {
            initAudioContext();
            const file = e.target.files[0];
            if (file) {
                audioElement.src = URL.createObjectURL(file);
                document.getElementById('track-title').innerText = file.name;
                audioElement.play();
                isPlaying = true;
                document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
                document.getElementById('track-status').innerText = "کسٹم MP3 پلے ہو رہا ہے";
                startReels();
            }
        }

        function togglePlay() {
            initAudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (isPlaying) {
                audioElement.pause();
                stopReels();
                isPlaying = false;
                document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-play"></i>';
                document.getElementById('track-status').innerText = "پاؤزڈ";
            } else {
                audioElement.play().catch(() => playSynthBeat());
                startReels();
                isPlaying = true;
                document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
            }
        }

        function stopAudio() {
            audioElement.pause();
            audioElement.currentTime = 0;
            stopReels();
            isPlaying = false;
            document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-play"></i>';
            document.getElementById('track-status').innerText = "روک دیا گیا";
        }

        function changeSpeed(val) {
            audioElement.playbackRate = val;
            document.getElementById('speed-val').innerText = val + 'x';
        }

        function startReels() {
            document.getElementById('reel1').classList.add('spinning');
            document.getElementById('reel2').classList.add('spinning');
        }

        function stopReels() {
            document.getElementById('reel1').classList.remove('spinning');
            document.getElementById('reel2').classList.remove('spinning');
        }
    </script>
</body>
</html>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-gray-600 border-t border-gray-900">
        <p>© 2026 Deluxe Retro Music Web App</p>
    </footer>

    <!-- Logic -->
    <script>
        const player = document.getElementById('main-player');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const titleDisplay = document.getElementById('current-title');
        const statusDisplay = document.getElementById('player-status');

        function playTrack(url, title) {
            player.src = url;
            titleDisplay.innerText = title;
            statusDisplay.innerText = "پلے ہو رہا ہے...";
            player.play().catch(e => {
                alert("آڈیو لوڈ ہونے میں مسئلہ ہے، برائے مہربانی دوبارہ پلے پر کلک کریں۔");
            });
            startSpin();
        }

        function startSpin() {
            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            statusDisplay.innerText = "پلے ہو رہا ہے";
        }

        function stopSpin() {
            reel1.classList.remove('spinning');
            reel2.classList.remove('spinning');
            statusDisplay.innerText = "روکا گیا ہے";
        }

        player.onplay = startSpin;
        player.onpause = stopSpin;
        player.onended = stopSpin;
    </script>

</body>
</html>
