<!DOCTYPE html>
<html lang="ur" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chai Khana Radio ☕ — Quetta Dhaba & Truck Art Vibes</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Urdu Google Fonts (Noto Nastaliq Urdu & Gulzar) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400..700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            nastaliq: ['"Noto Nastaliq Urdu"', 'serif'],
            gulzar: ['Gulzar', 'serif'],
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            truckRed: '#D90429',
            truckYellow: '#FFB703',
            truckBlue: '#023E8A',
            truckGreen: '#2A9D8F',
            dhabaBrown: '#2B1E1A',
          }
        }
      }
    }
  </script>

  <style>
    /* Neon Glow & Truck Art Styling */
    .truck-border {
      border: 4px solid #FFB703;
      outline: 4px dashed #D90429;
    }
    .neon-text {
      text-shadow: 0 0 8px rgba(255, 183, 3, 0.8), 0 0 20px rgba(217, 4, 41, 0.6);
    }
    .bg-dhaba {
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.85), rgba(43, 30, 26, 0.95)),
                  url('https://ibb.co/twfTW0Zd');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>

<body class="bg-zinc-950 text-white min-h-full font-sans bg-dhaba flex flex-col justify-between selection:bg-truckYellow selection:text-black">

  <!-- TOP BAR: Live PKT Time & Live Dhaba Visitors -->
  <header class="w-full px-4 py-3 border-b border-yellow-500/20 bg-black/40 backdrop-blur-md flex justify-between items-center z-50">
    <!-- Live Time -->
    <div class="flex items-center gap-2 bg-yellow-500/10 px-3 py-1 rounded-full border border-yellow-500/30">
      <span class="text-xs text-yellow-400 font-semibold tracking-wider dir-ltr" id="clock">--:-- --</span>
      <span class="text-[10px] text-yellow-200/70 font-nastaliq">پاکستان وقت</span>
    </div>

    <!-- Live Dhaba Count -->
    <div class="flex items-center gap-2 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="text-xs font-bold text-emerald-300" id="live-count">48</span>
      <span class="text-xs font-nastaliq text-emerald-200">ڈھابے پر موجود ہیں</span>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-xl w-full mx-auto px-4 py-6 flex flex-col items-center justify-center gap-5">

    <!-- LOGO / HEADER (TRUCK ART STYLE) -->
    <div class="text-center space-y-2">
      <div class="inline-block px-4 py-1 bg-truckRed text-yellow-300 font-nastaliq text-sm rounded-full tracking-wider shadow-lg transform -rotate-1 border border-yellow-400">
        👑 شاہی کوئٹہ ہوٹل اینڈ ڈرائیور ڈیرہ 👑
      </div>
      <h1 class="text-4xl sm:text-5xl font-bold font-gulzar text-truckYellow neon-text tracking-wide">
        چائے خانہ ریڈیو
      </h1>
      <p class="font-nastaliq text-sm text-zinc-300/80">
        "دیکھ مگر پیار سے — کلاسک پاکستان میلوڈیز"
      </p>
    </div>

    <!-- DIALOGUE BANNER -->
    <button id="dialogue-btn" class="w-full bg-black/60 border border-yellow-500/40 hover:border-yellow-400 p-3 rounded-2xl backdrop-blur-md text-center transition-all duration-300 shadow-lg group">
      <span class="text-lg">💬</span>
      <span id="dialogue-text" class="font-nastaliq text-yellow-200 text-base group-hover:text-white transition">
        "استاد! ایک کڑک چائے اور پراٹھا لگانا!"
      </span>
    </button>

    <!-- MUSIC PLAYER CARD -->
    <div class="w-full bg-black/70 backdrop-blur-xl border-2 border-yellow-500/40 rounded-3xl p-5 shadow-[0_10px_30px_rgba(0,0,0,0.8)] relative overflow-hidden">
      
      <!-- Top Truck Art Pattern Decor -->
      <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-truckRed via-truckYellow to-truckGreen"></div>

      <!-- Album Art & Track Info -->
      <div class="flex items-center gap-4 mb-4">
        <!-- Vinyl Record / Art Cover -->
        <div class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden border-2 border-yellow-400/80 shrink-0 shadow-md">
          <img id="track-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover" alt="Track Cover" />
          <div class="absolute inset-0 bg-black/20"></div>
        </div>

        <!-- Track Title & Singer -->
        <div class="flex-1 overflow-hidden text-right" dir="rtl">
          <span class="text-[10px] font-nastaliq text-truckYellow uppercase bg-truckRed/30 px-2 py-0.5 rounded border border-truckRed/50">
            سپر ہٹ نغمہ
          </span>
          <h2 id="track-title" class="font-gulzar text-xl sm:text-2xl text-white truncate mt-1">
            دل دل پاکستان
          </h2>
          <p id="track-artist" class="font-nastaliq text-xs text-zinc-400 truncate mt-0.5">
            وائٹل سائنز (Vital Signs)
          </p>
        </div>
      </div>

      <!-- Audio Progress Bar (Interactive Seek) -->
      <div class="space-y-1 my-3">
        <div id="seek-container" class="w-full bg-zinc-800 rounded-full h-2.5 overflow-hidden cursor-pointer relative">
          <div id="progress-bar" class="bg-gradient-to-r from-truckYellow to-truckRed h-full w-0 rounded-full transition-all duration-150"></div>
        </div>
        <div class="flex justify-between text-[11px] font-mono text-zinc-400" dir="ltr">
          <span id="time-curr">0:00</span>
          <span id="time-dur">0:00</span>
        </div>
      </div>

      <!-- Controls & Truck Horn -->
      <div class="flex items-center justify-between mt-4 px-2">
        <!-- Truck Horn Button -->
        <button id="horn-btn" class="p-3 bg-truckYellow/10 border border-truckYellow/40 rounded-2xl hover:bg-truckYellow/20 active:scale-95 transition text-xl" title="Truck Horn">
          🎺
        </button>

        <!-- Playback Controls -->
        <div class="flex items-center gap-3" dir="ltr">
          <button id="prev-btn" class="p-3 rounded-full bg-white/5 hover:bg-white/10 active:scale-95 transition text-yellow-400">
            ⏮️
          </button>

          <button id="play-btn" class="p-4 rounded-full bg-gradient-to-tr from-truckRed to-truckYellow text-black font-bold shadow-lg hover:scale-105 active:scale-95 transition text-2xl">
            ▶️
          </button>

          <button id="next-btn" class="p-3 rounded-full bg-white/5 hover:bg-white/10 active:scale-95 transition text-yellow-400">
            ⏭️
          </button>
        </div>

        <!-- Volume Mute Toggle -->
        <button id="mute-btn" class="p-3 bg-white/5 border border-white/10 rounded-2xl hover:bg-white/10 transition text-xl">
          🔊
        </button>
      </div>
    </div>

    <!-- INTERACTIVE "KARAK CHAI" COUNTER & SHARE -->
    <div class="w-full flex gap-3">
      <button id="chai-btn" class="flex-1 bg-gradient-to-r from-amber-700 to-amber-900 border border-amber-500/50 hover:border-amber-400 p-3.5 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition shadow-lg">
        <span class="text-2xl">☕</span>
        <div class="text-right" dir="rtl">
          <p class="font-gulzar text-sm text-amber-100">ایک کڑک چائے لاؤ</p>
          <p class="font-nastaliq text-[10px] text-amber-300/80">کل چائے کے آرڈر: <span id="chai-count" class="font-bold font-mono text-xs text-white">0</span></p>
        </div>
      </button>

      <button id="share-btn" class="bg-black/60 border border-white/10 hover:bg-black/80 px-4 rounded-2xl flex items-center justify-center text-xl active:scale-95 transition" title="Share Radio">
        🔗
      </button>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="w-full text-center py-4 border-t border-white/10 bg-black/50 text-xs font-nastaliq text-zinc-400">
    طراحی و تیار کردہ — <span class="text-truckYellow font-bold">Quetta Dhaba Devs</span> ❤️
  </footer>

  <!-- LINK TO JAVASCRIPT ENGINE -->
  <script src="app.js"></script>
</body>
</html>
