<!DOCTYPE html>
<html lang="ur" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>کوئٹہ رنگین ہوٹل ☕ — 90s پاکستانی کلاسک ریڈیو</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            nastaliq: ['"Noto Nastaliq Urdu"', 'serif'],
            gulzar: ['Gulzar', 'serif'],
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Background Image & Overlay */
    .hero-bg-container {
      background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.65)), url('hero-bg.png');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    @media (min-width: 640px) {
      .hero-bg-container {
        background-attachment: fixed;
      }
    }

    /* Spinning Vinyl Disc */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-spin {
      animation: spin 10s linear infinite;
    }
    .vinyl-paused {
      animation-play-state: paused;
    }

    /* Crisp High-Contrast Golden Urdu Titles */
    .heading-gold {
      color: #FFC72C;
      text-shadow: 
        0 2px 4px rgba(0, 0, 0, 0.9),
        0 0 12px rgba(255, 199, 44, 0.4),
        0 0 25px rgba(0, 0, 0, 0.8);
    }

    .subheading-gold {
      color: #FFE58F;
      text-shadow: 
        0 2px 4px rgba(0, 0, 0, 0.9),
        0 0 8px rgba(255, 229, 143, 0.3);
    }

    /* Pan Wala Style Slick Progress Bar */
    .pan-seekbar-fill {
      background: #FFF;
      border-radius: 99px;
      transition: width 150ms linear;
    }

    .pan-seekbar-slider {
      width: 14px;
      height: 14px;
      background: #FFF;
      border-radius: 50%;
      border: 2px solid #fff;
      transform: translateX(50%);
      transition: all 150ms linear;
    }

    #seek-container:hover .pan-seekbar-slider {
      transform: translateX(50%) scale(1.2);
    }

    /* Toast Animation */
    @keyframes slideUpFade {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    .toast-animate {
      animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="bg-zinc-950 text-white min-h-screen font-sans hero-bg-container flex flex-col justify-between selection:bg-amber-400 selection:text-black relative overflow-x-hidden">

  <!-- TOP BAR (Pan Wala Style Pill) -->
  <header class="w-full px-3 sm:px-8 py-2.5 sm:py-3.5 flex justify-between items-center z-50 select-none">
    
    <!-- Time Pill -->
    <div class="bg-black/60 backdrop-blur-md border border-white/10 px-2.5 sm:px-4 py-1 sm:py-1.5 rounded-full flex items-center gap-1.5 shadow-lg">
      <span class="text-[10px] sm:text-xs font-mono font-semibold text-amber-300" id="clock">--:-- --</span>
      <span class="text-[10px] sm:text-[11px] font-nastaliq text-white/70">پاکستان</span>
    </div>

    <!-- Live Real Visitors Pill -->
    <div class="bg-black/60 backdrop-blur-md border border-white/10 px-2.5 sm:px-4 py-1 sm:py-1.5 rounded-full flex items-center gap-1.5 shadow-lg">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="text-[11px] sm:text-xs font-bold font-mono text-emerald-300" id="live-count">1</span>
      <span class="text-[10px] sm:text-xs font-nastaliq text-white/80">ڈھابے پر موجود ہیں</span>
    </div>

  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="w-full max-w-sm sm:max-w-xl mx-auto px-4 py-4 flex flex-col items-center gap-4 sm:gap-6 z-10 my-auto">

    <!-- HEADINGS -->
    <div class="text-center space-y-0.5 sm:space-y-1 select-none">
      <h1 class="text-3xl sm:text-5xl md:text-6xl font-bold font-gulzar heading-gold tracking-wide leading-tight">
        کوئٹہ رنگین ہوٹل
      </h1>
      <p class="font-nastaliq text-xs sm:text-base subheading-gold font-medium">
        دیکھ مگر پیار سے
      </p>
    </div>

    <!-- PAN WALA STYLE DIALOGUE BANNER (EMERALD) -->
    <div id="dialogue-btn" class="bg-[#1C3A29]/80 border border-emerald-800/60 hover:border-emerald-600/60 px-4 py-2 sm:py-2.5 rounded-full backdrop-blur-md text-center transition cursor-pointer shadow-xl group flex items-center gap-2 max-w-[85vw]">
      <span class="text-emerald-300 group-hover:scale-110 transition">💬</span>
      <span id="dialogue-text" class="font-nastaliq text-emerald-100 text-[11px] sm:text-sm group-hover:text-white transition truncate">
        "استاد! ایک کڑک چائے اور پراٹھا لگانا!"
      </span>
    </div>

    <!-- PAN WALA STYLE PLAYER CARD (CLEAN & PROFESSIONAL) -->
    <div class="w-full max-w-lg bg-[#2B1B0E]/90 backdrop-blur-2xl border border-amber-900/40 rounded-3xl p-4 sm:p-5 shadow-2xl relative overflow-hidden">
      
      <div class="flex items-center gap-4 sm:gap-5">
        
        <!-- Vinyl Disc (Clean Circle Wrapper) -->
        <div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden shrink-0 shadow-xl border border-amber-500/20 max-w-[64px] max-h-[64px] sm:max-w-[80px] sm:max-h-[80px]">
          <img id="track-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=300&auto=format&fit=crop" class="w-full h-full object-cover vinyl-spin vinyl-paused" alt="Album Disc" />
          <div class="absolute inset-0 m-auto w-3 h-3 sm:w-4 sm:h-4 bg-zinc-950 border-2 border-amber-500/60 rounded-full shadow-inner"></div>
        </div>

        <!-- Track Info & Pan Wala Slick Progress Bar (Center) -->
        <div class="flex-1 min-w-0 text-right space-y-1.5" dir="rtl">
          <h2 id="track-title" class="font-sans font-semibold text-sm sm:text-lg text-white truncate leading-snug">
            Dil Dil Pakistan
          </h2>
          <p id="track-artist" class="font-sans text-[10px] sm:text-xs text-white/60 truncate dir-ltr text-right pb-1">
            Vital Signs
          </p>

          <!-- PAN WALA SEEKBAR (CLEAN, NO CHAI) -->
          <div class="pt-0.5" dir="ltr">
            <div id="seek-container" class="w-full bg-white/10 hover:bg-white/20 rounded-full h-[6px] relative cursor-pointer flex items-center overflow-visible group">
              <!-- Progress Fill -->
              <div id="progress-bar" class="pan-seekbar-fill h-full w-0 relative flex items-center justify-end">
                <!-- Slider Button (White) -->
                <div class="pan-seekbar-slider shadow-lg scale-0 group-hover:scale-100 transition-transform"></div>
              </div>
            </div>
            
            <div class="flex justify-between text-[9px] sm:text-[11px] font-mono text-white/50 dir-ltr pt-1.5">
              <span id="time-curr">0:00</span>
              <span>/</span>
              <span id="time-dur">0:00</span>
            </div>
          </div>
        </div>

        <!-- PAN WALA STYLE PLAYER CONTROLS (RIGHT) -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 dir-ltr shrink-0">
          <button id="prev-btn" class="text-white/70 hover:text-white active:scale-90 transition text-xs sm:text-sm p-1.5">
            ⏮
          </button>

          <!-- Play/Pause Button (PAN WALA WHTE SQUARE ROUNDED) -->
          <button id="play-btn" class="w-11 h-11 sm:w-13 sm:h-13 rounded-2xl bg-white text-black font-bold shadow-2xl hover:scale-105 active:scale-95 transition flex items-center justify-center text-sm sm:text-lg pl-0.5">
            ▶
          </button>

          <button id="next-btn" class="text-white/70 hover:text-white active:scale-90 transition text-xs sm:text-sm p-1.5">
            ⏭
          </button>
        </div>

      </div>

    </div>

    <!-- ACTION BUTTONS (CLEAN PAN WALA STYLE) -->
    <div class="w-full max-w-lg flex flex-row items-center gap-3">
      <!-- Chai Order Button (Clean Emerald) -->
      <button id="chai-btn" class="flex-1 bg-emerald-900/90 hover:bg-emerald-800 border border-emerald-800/60 py-2.5 px-4 rounded-xl sm:rounded-2xl flex items-center justify-between active:scale-95 transition shadow-lg backdrop-blur-md">
        <div class="flex items-center gap-2" dir="rtl">
          <span class="text-base sm:text-lg">☕</span>
          <span class="font-gulzar text-xs sm:text-sm text-emerald-100">استاد! ایک کڑک چائے لگاؤ</span>
        </div>
        <span id="chai-count" class="bg-emerald-950 text-emerald-300 font-bold font-mono text-[11px] sm:text-xs px-2 py-0.5 rounded-full border border-emerald-700">0</span>
      </button>

      <!-- Share Button (Compact Pan Wala Style) -->
      <button id="share-btn" class="bg-[#1C3A29]/60 hover:bg-[#1C3A29]/80 border border-emerald-800/50 hover:border-emerald-600/50 px-4 py-2.5 rounded-xl sm:rounded-2xl flex items-center justify-center text-xs font-gulzar text-emerald-200 hover:text-white active:scale-95 transition backdrop-blur-md gap-1.5">
        <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4 sm:w-5 sm:h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        <span class="hidden sm:inline">شیئر لنک</span>
      </button>
    </div>

  </main>

  <!-- POPUP DIALOGUE TOAST -->
  <div id="toast-popup" class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-[#1C3A29]/95 border border-emerald-800 text-emerald-100 font-nastaliq text-xs sm:text-sm px-4 py-2.5 rounded-full shadow-2xl backdrop-blur-md hidden z-50 transition-all pointer-events-none text-center whitespace-nowrap max-w-[90vw] truncate">
    <span id="toast-text">استاد! ایک کڑک چائے اور پراٹھا لگانا!</span>
  </div>

    <!-- HIDDEN SOUNDCLOUD IFRAME -->
  <div style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none;">
    <iframe 
      id="sc-audio-player" 
      src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293" 
      allow="autoplay" 
      frameborder="0">
    </iframe>
  </div>

  <!-- SOUNDCLOUD OFFICIAL WIDGET API -->
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="app.js"></script>
</body>
</html>



  <!-- FOOTER (Clean Pan Wala Style) -->
  <footer class="w-full text-center py-2 sm:py-3 bg-black/60 backdrop-blur-md text-[10px] sm:text-xs font-nastaliq text-white/50 border-t border-white/5 z-10">
    دیکھ مگر پیار سے — <strong>کوئٹہ رنگین ہوٹل ریڈیو</strong> ❤️
  </footer>

  <script src="app.js"></script>
</body>
</html>
