<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڈیلکس - کلاسک میوزک پلیئر</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Urdu Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Nastaliq Urdu', serif;
            background: #090a0f;
            color: #f3f4f6;
        }
        .font-gulzar {
            font-family: 'Gulzar', serif;
        }
        .glass-card {
            background: rgba(18, 20, 29, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .spinning {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(-360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black">

    <!-- Header -->
    <header class="py-8 text-center border-b border-gray-800/80 bg-black/40">
        <h1 class="text-4xl md:text-5xl font-bold font-gulzar text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500">
            ڈیلکس نوسٹالجیا
        </h1>
        <p class="text-xs text-gray-400 mt-2 tracking-widest">کلاسک پاکستانی آڈیو کا خزانہ</p>
    </header>

    <!-- Main Music Player Dashboard -->
    <main class="container mx-auto px-4 py-8 max-w-4xl">
        
        <div class="glass-card rounded-3xl p-6 md:p-10 shadow-2xl">
            
            <!-- Cassette & Album Art View -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center mb-8">
                
                <!-- Reel Animation Box -->
                <div class="bg-gradient-to-b from-gray-900 to-black p-6 rounded-2xl border border-amber-500/30 flex flex-col items-center justify-center relative overflow-hidden shadow-inner">
                    <div class="absolute inset-0 bg-amber-500/5 blur-2xl"></div>
                    
                    <span id="player-status" class="text-xs text-amber-400 uppercase tracking-widest mb-4 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                        تیار ہے
                    </span>

                    <!-- Spinning Reels -->
                    <div class="flex justify-center items-center gap-6 my-4 relative z-10">
                        <div id="reel1" class="w-20 h-20 rounded-full border-4 border-dashed border-amber-400 bg-black flex items-center justify-center shadow-lg">
                            <div class="w-8 h-8 bg-amber-500/20 rounded-full border border-amber-400/50"></div>
                        </div>
                        <div class="h-1.5 w-12 bg-amber-800/80 rounded"></div>
                        <div id="reel2" class="w-20 h-20 rounded-full border-4 border-dashed border-amber-400 bg-black flex items-center justify-center shadow-lg">
                            <div class="w-8 h-8 bg-amber-500/20 rounded-full border border-amber-400/50"></div>
                        </div>
                    </div>

                    <h3 id="current-title" class="text-lg font-bold text-amber-300 mt-4 text-center truncate w-full">
                        کوئی گانا منتخب کریں
                    </h3>
                </div>

                <!-- Playlist Details -->
                <div class="flex flex-col justify-between">
                    <div>
                        <h2 class="text-xl font-bold text-gray-200 mb-4 border-b border-gray-800 pb-2">
                            <i class="fa-solid fa-list-ul text-amber-400 ml-2"></i> پلے لسٹ (پاکستان کلاسک)
                        </h2>
                        
                        <div class="space-y-3">
                            <button onclick="playTrack('https://archive.org/download/MadamNoorJehanClassicHits/Madam%20Noor%20Jehan%20-%20Aawaz%20De%20Kahan%20Hai.mp3', 'میڈم نور جہان — آواز دے کہاں ہے')" 
                                    class="w-full text-right bg-slate-900/60 hover:bg-amber-500 hover:text-black p-4 rounded-xl font-bold transition flex items-center justify-between border border-gray-800 group">
                                <span class="text-sm">1. میڈم نور جہان — آواز دے کہاں ہے</span>
                                <i class="fa-solid fa-play text-amber-400 group-hover:text-black"></i>
                            </button>

                            <button onclick="playTrack('https://archive.org/download/NusratFatehAliKhanQawwali/Sanu%20Ek%20Pal%20Chain.mp3', 'نصرت فتح علی خان — سانوں اک پل چین')" 
                                    class="w-full text-right bg-slate-900/60 hover:bg-amber-500 hover:text-black p-4 rounded-xl font-bold transition flex items-center justify-between border border-gray-800 group">
                                <span class="text-sm">2. نصرت فتح علی خان — سانوں اک پل چین</span>
                                <i class="fa-solid fa-play text-amber-400 group-hover:text-black"></i>
                            </button>

                            <button onclick="playTrack('https://archive.org/download/VitalSignsDilDilPakistan/Dil%20Dil%20Pakistan.mp3', 'وائٹل سائنز — دل دل پاکستان')" 
                                    class="w-full text-right bg-slate-900/60 hover:bg-amber-500 hover:text-black p-4 rounded-xl font-bold transition flex items-center justify-between border border-gray-800 group">
                                <span class="text-sm">3. وائٹل سائنز — دل دل پاکستان</span>
                                <i class="fa-solid fa-play text-amber-400 group-hover:text-black"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Native Native Player Controls -->
            <div class="pt-6 border-t border-gray-800">
                <audio id="main-player" class="w-full" controls></audio>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-gray-600 border-t border-gray-900">
        <p>© 2026 Deluxe Retro Music Web App</p>
    </footer>

    <!-- Logic -->
    <script>
        const player = document.getElementById('main-player');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const titleDisplay = document.getElementById('current-title');
        const statusDisplay = document.getElementById('player-status');

        function playTrack(url, title) {
            player.src = url;
            titleDisplay.innerText = title;
            statusDisplay.innerText = "پلے ہو رہا ہے...";
            player.play().catch(e => {
                alert("آڈیو لوڈ ہونے میں مسئلہ ہے، برائے مہربانی دوبارہ پلے پر کلک کریں۔");
            });
            startSpin();
        }

        function startSpin() {
            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            statusDisplay.innerText = "پلے ہو رہا ہے";
        }

        function stopSpin() {
            reel1.classList.remove('spinning');
            reel2.classList.remove('spinning');
            statusDisplay.innerText = "روکا گیا ہے";
        }

        player.onplay = startSpin;
        player.onpause = stopSpin;
        player.onended = stopSpin;
    </script>

</body>
</html>
